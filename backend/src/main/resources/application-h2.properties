# H2 profile (persistent, file-based)
# Enable with: SPRING_PROFILES_ACTIVE=h2

# Stores the DB on disk so newly registered users can re-login after restarts.
spring.datasource.url=jdbc:h2:file:./data/fedfdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
# Keep blank for local dev. If you change this, you must recreate the H2 DB file.
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Recreate schema each run in H2 mode
spring.jpa.hibernate.ddl-auto=update
