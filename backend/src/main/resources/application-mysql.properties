# MySQL profile
# Enable with: SPRING_PROFILES_ACTIVE=mysql

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fedfdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Persist schema/data across restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Explicit dialect (helps during startup / clearer errors)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# H2 console off in MySQL mode
spring.h2.console.enabled=false

# Optional: tune logging in MySQL mode
spring.jpa.show-sql=false
