# PostgreSQL profile (Render-friendly)
# Enable with: SPRING_PROFILES_ACTIVE=postgres

# Prefer explicit JDBC URL if provided.
# On Render you can set SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
# For local dev you can use DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fedfdb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Persist schema/data across restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 console off in Postgres mode
spring.h2.console.enabled=false
