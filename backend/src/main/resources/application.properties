# Application
spring.application.name=fedf-backend
server.port=${PORT:8080}

# Default profile
# - Uses MySQL when no profile is explicitly set.
# - To use H2 in-memory instead: SPRING_PROFILES_ACTIVE=h2
spring.profiles.default=mysql

# Optional local env file support (do not commit secrets)
# Place DB_* variables in backend/.env and Spring will pick them up.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# JPA Optimizations
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# NOTE: For deployments set JWT_SECRET as a secure random Base64 string.
jwt.secret=${JWT_SECRET:WW91clN1cGVyU2VjcmV0S2V5Rm9ySldUVG9rZW5HZW5lcmF0aW9uTWFrZUl0TG9uZ0FuZFNlY3VyZTEyMzQ1Njc4OQ==}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# Cache
app.cache.redis.enabled=false

# Rate limiting
rate.limit.enabled=true
rate.limit.capacity=120
rate.limit.refill-seconds=60

# CORS
# For deployments set CORS_ALLOWED_ORIGINS to your frontend URL(s), comma-separated.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173,http://localhost:3000,http://127.0.0.1:3000}

# Logging
logging.level.com.fedf=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# GitHub
github.token=
