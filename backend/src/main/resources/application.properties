# Application
spring.application.name=fedf-backend
server.port=${PORT:8080}

# JPA
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:WW91clN1cGVyU2VjcmV0S2V5Rm9ySldUVG9rZW5HZW5lcmF0aW9uTWFrZUl0TG9uZ0FuZFNlY3VyZTEyMzQ1Njc4OQ==}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# Cache
app.cache.redis.enabled=false

# Rate Limiting
rate.limit.enabled=true
rate.limit.capacity=120
rate.limit.refill-seconds=60

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging
logging.level.com.fedf=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# GitHub token from Render environment
github.token=${GITHUB_TOKEN}